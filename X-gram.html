<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ffffff">
<title>Xgram — Bagikan momenmu</title>
<style>
:root{--purple:#8b5cf6;--pink:#ec4899;--line:#e8e8e8;--muted:#777;--bg:#fafafa}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#202124;font:15px system-ui,-apple-system,Segoe UI,Roboto,Arial}button{border:0;border-radius:9px;padding:10px 14px;background:var(--purple);color:#fff;font-weight:650;cursor:pointer}button:active{transform:scale(.98)}button.secondary{background:#f1edff;color:#6d28d9}button.text{background:transparent;color:#333;padding:7px}input,textarea{font:inherit;width:100%;padding:12px;border:1px solid #ddd;border-radius:9px;margin:7px 0;background:#fff}header{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line)}nav{max-width:980px;margin:auto;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px}.logo{font-size:27px;font-weight:850;letter-spacing:-1.5px;background:linear-gradient(45deg,#7c3aed,#ec4899);color:transparent;background-clip:text}.navbuttons{display:flex;gap:5px;align-items:center}main{max-width:650px;margin:22px auto;padding:0 12px}.panel,.post{background:#fff;border:1px solid var(--line);border-radius:14px;margin-bottom:17px;overflow:hidden}.pad{padding:15px}.auth{max-width:390px;margin:55px auto;background:#fff;border:1px solid var(--line);border-radius:16px;padding:25px}.muted{color:var(--muted);font-size:13px}.row{display:flex;align-items:center;gap:10px}.avatar{width:42px;height:42px;border-radius:50%;object-fit:cover;background:linear-gradient(135deg,#ddd,#f6d8f0);display:grid;place-items:center;font-weight:800;color:#7c3aed;flex-shrink:0}.postimg{width:100%;max-height:680px;object-fit:contain;background:#f7f7f7;display:block}.actions{display:flex;align-items:center;gap:8px;margin:8px 0}.like{font-size:20px;background:transparent;color:#222;padding:4px 7px}.like.liked{color:#e11d48}.storyrow{display:flex;gap:13px;overflow:auto;padding:14px}.story{text-align:center;min-width:62px;font-size:12px;cursor:pointer}.storyring{width:58px;height:58px;border-radius:50%;padding:3px;background:linear-gradient(45deg,#f59e0b,#ec4899,#8b5cf6);margin:auto auto 5px}.storyring .avatar{width:100%;height:100%;border:2px solid white}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px}.grid img,.grid video{width:100%;aspect-ratio:1;object-fit:cover}.hidden{display:none!important}.profilehead{display:flex;align-items:center;gap:20px;padding:20px}.profilepic{width:82px;height:82px;border-radius:50%;background:#eee;object-fit:cover}.statrow{display:flex;gap:20px;margin:12px 0}.statrow b{display:block;text-align:center}.composer label{font-size:13px;color:#666}.empty{text-align:center;padding:30px;color:#777}body.dark{--bg:#111318;--line:#2b2e36;--muted:#a1a1aa;color:#f3f4f6;--text:#f3f4f6}body.dark header,body.dark .panel,body.dark .post,body.dark .auth,body.dark #profile,body.dark .footer{background:#1b1d24;color:#f3f4f6;border-color:#30333c}body.dark input,body.dark textarea{background:#252832;color:#f3f4f6;border-color:#3b3f4a}body.dark button.text,body.dark .like{color:#f3f4f6}body.dark .postimg{background:#17191f}.profilecover{height:150px;background-position:center;background-size:cover;background-color:#e9d5ff;position:relative}.profiletools{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}.profiletools button{font-size:12px;padding:8px 10px}.chatlist{padding:12px}.chatitem{display:flex;align-items:center;gap:10px;padding:12px;border-bottom:1px solid var(--line);cursor:pointer}.chatbox{display:flex;flex-direction:column;height:65vh}.chatmsgs{flex:1;overflow:auto;padding:12px}.bubble{max-width:78%;padding:9px 12px;border-radius:14px;margin:6px 0;background:#eee;color:#222}.bubble.mine{margin-left:auto;background:#8b5cf6;color:white}.chatcompose{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line)}.chatcompose input{margin:0}.story img.storyphoto{width:100%;height:100%;object-fit:cover;border-radius:50%}.profilehead{position:relative}.profilepic{border:3px solid white}.verified{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:50%;background:#3897f0;color:#fff;font-size:11px;font-weight:800;vertical-align:middle;margin-left:4px}.role-badge{display:inline-block;background:#e8f2ff;color:#1769c2;border:1px solid #c8e0ff;border-radius:5px;padding:2px 6px;font-size:11px;font-weight:700;vertical-align:middle;margin-left:5px}.icon{width:20px;height:20px;display:inline-block;vertical-align:middle;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.icon.small{width:18px;height:18px}.icon.heart{fill:none}.like.liked .icon.heart{fill:currentColor;stroke:currentColor}

#uploadPage {position: fixed;top: 0; left: 0; right: 0; bottom: 0;background: var(--bg);z-index: 100;overflow-y: auto;padding: 20px;}
#uploadPage .upload-container {max-width: 500px;margin: 0 auto;background: #fff;border: 1px solid var(--line);border-radius: 14px;padding: 20px;}
body.dark #uploadPage .upload-container { background: #1b1d24; border-color: #30333c; }

.footer {position: fixed; bottom: 0; left: 0; right: 0; background: #fff; border-top: 1px solid var(--line); display: flex; justify-content: space-around; align-items: center; padding: 12px 10px; z-index: 10;}
body.dark .footer { background: #1b1d24; border-color: #30333c; }
.footer button {background: transparent; color: #444; padding: 0; display: flex; justify-content: center; align-items: center;}
body.dark .footer button { color: #f3f4f6; }
.footer .icon { width: 26px; height: 26px; }
.footer button.plusbtn-nav { transform: scale(1.1); color: var(--purple); }
body.dark .footer button.plusbtn-nav { color: var(--purple); }

#storyviewer {position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 999; display: flex; flex-direction: column;}
.story-header {padding: 15px; display: flex; align-items: center; justify-content: space-between; color: white; z-index: 10; background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent);}
.story-user {font-weight: bold; display: flex; align-items: center; gap: 10px;}
.story-user .avatar {width: 35px; height: 35px; border: 2px solid white;}
.story-close {background: transparent; color: white; font-size: 24px; padding: 5px 10px; cursor: pointer;}
.story-img-container {flex: 1; display: flex; justify-content: center; align-items: center; overflow: hidden; position: relative;}
.story-img-container img, .story-img-container video {max-width: 100%; max-height: 100%; object-fit: contain;}
.progress-bar {width: 100%; height: 3px; background: rgba(255,255,255,0.3); position: absolute; top: 0; left: 0; z-index: 20;}
.progress-fill {height: 100%; background: white; width: 0%; transition: width 5s linear;}

@media(max-width:600px){
  main{margin:12px auto 80px;}
  .navbuttons button{padding:8px 9px;font-size:12px;}
  .profilehead{gap:14px;padding:15px;}
  .profilepic{width:70px;height:70px;}
  .logo{font-size:24px;}
  .navbuttons .logout-btn { display: none; } 
}
</style></head>
<body>

<header>
  <nav>
    <div class="logo">Xgram</div>
    <div class="navbuttons">
      <button class="secondary" onclick="toggleTheme()" id="themeBtn" title="Gelap/terang"></button>
      <button class="secondary" onclick="showChats()" title="Chat"><svg class="icon" viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg></button>
      <button class="secondary" onclick="showProfile()" title="Profil"><svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg></button>
      <button class="logout-btn" onclick="logout()">Keluar</button>
    </div>
  </nav>
</header>

<section id="auth" class="auth"><div class="logo">Xgram</div><h2>Bagikan momenmu.</h2><p class="muted">Temukan teman dan ceritakan keseharianmu.</p><input id="username" autocomplete="username" placeholder="Username"><input id="password" type="password" autocomplete="current-password" placeholder="Password"><div class="row"><button onclick="signup()">Buat akun</button><button class="secondary" onclick="login()">Login</button></div><p id="authmsg" class="muted"></p><p class="muted">Demo lokal: akun hanya tersimpan di browser ini.</p></section>

<main id="app" class="hidden">
  <section id="profile" class="panel hidden"></section>
  <section id="chats" class="panel hidden"></section>
  <section id="stories" class="panel"><div class="storyrow" id="storyrow"></div></section>
  <div id="feed"></div>
</main>

<section id="uploadPage" class="hidden">
  <div class="upload-container">
    <div class="row" style="justify-content:space-between; margin-bottom: 15px;">
      <h3 style="margin:0">Buat postingan</h3>
      <button class="secondary" onclick="closeComposer()">Batal</button>
    </div>
    <label for="photo">Pilih foto/video</label>
    <input type="file" id="photo" accept="image/*,video/*">
    <textarea id="caption" rows="3" placeholder="Tulis caption..."></textarea>
    <button style="width:100%; margin-top:10px;" id="btnUpload" onclick="createPost()">Bagikan</button>
  </div>
</section>

<section id="storyviewer" class="hidden">
  <div class="progress-bar"><div class="progress-fill" id="story-progress"></div></div>
  <div class="story-header">
    <div class="story-user">
      <img id="storyviewimgprofile" class="avatar" src="" alt="Profile">
      <span id="storyviewuser">@username</span>
    </div>
    <button class="story-close" onclick="closeStory()">✕</button>
  </div>
  <div class="story-img-container" id="story-media-container">
    <!-- Media akan dimuat via JS -->
  </div>
</section>

<div class="footer">
  <button onclick="showFeed()" aria-label="Beranda" title="Beranda">
    <svg class="icon" viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10h-6v-6H9v6H3z"/></svg>
  </button>
  <button class="plusbtn-nav" onclick="openComposer()" aria-label="Buat postingan" title="Buat postingan">
    <svg class="icon" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
  </button>
</div>

<script>
// ====== SETUP INDEXEDDB ======
let db;
const request = indexedDB.open("XgramDB", 1);
request.onupgradeneeded = e => {
  db = e.target.result;
  if (!db.objectStoreNames.contains('posts')) db.createObjectStore('posts', { keyPath: 'id' });
  if (!db.objectStoreNames.contains('stories')) db.createObjectStore('stories', { keyPath: 'id' });
};
request.onsuccess = e => {
  db = e.target.result;
  init(); // Jalankan aplikasi setelah DB siap
};

function dbSave(storeName, data) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(storeName, 'readwrite');
    const store = tx.objectStore(storeName);
    store.put(data);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

function dbGetAll(storeName) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(storeName, 'readonly');
    const store = tx.objectStore(storeName);
    const req = store.getAll();
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

// ====== VARIABEL GLOBAL ======
const $=id=>document.getElementById(id);
let users=JSON.parse(localStorage.getItem('xgramUsers')||'{}'),
    chats=JSON.parse(localStorage.getItem('xgramChats')||'{}'),
    posts=[],
    stories=[],
    current=localStorage.getItem('xgramCurrent')||'';

if(localStorage.getItem('xgramTheme')==='dark')document.body.classList.add('dark');

function saveLocal(){
  localStorage.setItem('xgramUsers',JSON.stringify(users));
  localStorage.setItem('xgramChats',JSON.stringify(chats));
}

// ====== FUNGSI UTAMA ======
async function init(){
  if(!current||!users[current]){
    $('auth').classList.remove('hidden');
    return;
  }
  users[current].verified=true;
  users[current].role='Developer';
  users[current].avatar=users[current].avatar||'';
  users[current].wallpaper=users[current].wallpaper||'';
  users[current].followers=users[current].followers||[];
  users[current].following=users[current].following||[];
  saveLocal();
  
  // Ambil data dari IndexedDB
  posts = await dbGetAll('posts');
  stories = await dbGetAll('stories');
  
  // Urutkan dari yang terbaru
  posts.sort((a,b)=>b.id-a.id);
  stories.sort((a,b)=>b.id-a.id);

  $('auth').classList.add('hidden');
  $('app').classList.remove('hidden');
  updateThemeButton();
  renderStories();
  showFeed();
}

function signup(){let u=$('username').value.trim(),p=$('password').value;if(!u||!p){$('authmsg').textContent='Masukkan username dan password.';return}if(users[u]){$('authmsg').textContent='Username sudah dipakai.';return}users[u]={password:p,bio:'',avatar:'',wallpaper:'',followers:[],following:[]};current=u;localStorage.setItem('xgramCurrent',u);saveLocal();init()}
function login(){let u=$('username').value.trim(),p=$('password').value;if(users[u]&&users[u].password===p){current=u;localStorage.setItem('xgramCurrent',u);init()}else $('authmsg').textContent='Username atau password salah.'}
function logout(){current='';localStorage.removeItem('xgramCurrent');$('app').classList.add('hidden');$('auth').classList.remove('hidden');$('uploadPage').classList.add('hidden');$('storyviewer').classList.add('hidden')}

function openComposer(){
  $('uploadPage').classList.remove('hidden');
  setTimeout(()=>$('photo').click(), 10); 
}
function closeComposer(){
  $('uploadPage').classList.add('hidden');
  $('photo').value = '';
  $('caption').value = '';
}

// ====== FUNGSI MEDIA (GAMBAR/VIDEO) ======
function readMedia(file, callback) {
  if (!file) return;
  let reader = new FileReader();
  reader.onload = e => callback(e.target.result, file.type);
  reader.readAsDataURL(file);
}

async function addStory(){
  let inp=document.createElement('input');
  inp.type='file';
  inp.accept='image/*,video/*';
  inp.onchange=()=>{
    if(!inp.files[0]) return;
    readMedia(inp.files[0], async (data, type) => {
      let newStory = {id:Date.now(),user:current,img:data,type:type,created:Date.now()};
      await dbSave('stories', newStory);
      stories.unshift(newStory);
      renderStories();
      alert('Story berhasil ditambahkan!');
    });
  };
  inp.click();
}

async function viewStory(id){
  let st=stories.find(x=>x.id===id);
  if(!st)return;
  
  let container = $('story-media-container');
  if(st.type && st.type.startsWith('video')){
    container.innerHTML = `<video src="${st.img}" autoplay controls></video>`;
  } else {
    container.innerHTML = `<img src="${st.img}" alt="Story">`;
  }

  $('storyviewuser').textContent='@'+st.user;
  $('storyviewimgprofile').src = users[st.user]?.avatar || ''; 
  $('storyviewer').classList.remove('hidden');
  
  let progress = $('story-progress');
  progress.style.transition = 'none';
  progress.style.width = '0%';
  setTimeout(()=>{
    progress.style.transition = 'width 5s linear';
    progress.style.width = '100%';
  }, 50);

  window.storyTimer = setTimeout(()=>{ closeStory(); }, 5000);
}

function closeStory(){
  $('storyviewer').classList.add('hidden');
  $('story-media-container').innerHTML = '';
  clearTimeout(window.storyTimer);
  $('story-progress').style.transition = 'none';
  $('story-progress').style.width = '0%';
}

async function createPost(){
  let f=$('photo').files[0],caption=$('caption').value.trim();
  if(!f){alert('Pilih foto/video dulu.');return}
  
  let btn = $('btnUpload');
  btn.innerText = 'Memproses...';
  btn.disabled = true;

  readMedia(f, async (data, type) => {
    let newPost = {id:Date.now(),user:current,img:data,type:type,caption,likes:[],comments:[],created:new Date().toISOString()};
    await dbSave('posts', newPost);
    posts.unshift(newPost);
    
    closeComposer(); 
    showFeed();
    btn.innerText = 'Bagikan';
    btn.disabled = false;
  });
}

async function like(id){
  let p=posts.find(x=>x.id===id);
  if(!p)return;
  p.likes=p.likes||[];
  p.likes.includes(current)?p.likes=p.likes.filter(x=>x!==current):p.likes.push(current);
  await dbSave('posts', p);
  showFeed();
}

async function comment(id){
  let t=prompt('Tulis komentar:');
  if(!t||!t.trim())return;
  let p=posts.find(x=>x.id===id);
  p.comments=p.comments||[];
  p.comments.push({user:current,text:t.trim()});
  await dbSave('posts', p);
  showFeed();
}

function showFeed(){
  $('profile').classList.add('hidden');
  $('chats').classList.add('hidden');
  $('stories').classList.remove('hidden');
  $('uploadPage').classList.add('hidden'); 
  
  $('feed').innerHTML=posts.map(p=>{
    p.likes=p.likes||[];
    p.comments=p.comments||[];
    let mediaHTML = (p.type && p.type.startsWith('video')) 
      ? `<video class="postimg" src="${p.img}" controls></video>` 
      : `<img class="postimg" src="${p.img}" alt="Post by ${esc(p.user)}">`;

    return `<article class="post"><div class="pad row">${avatarHTML(p.user)}<div><b><button class="text" onclick="viewProfile('${esc(p.user)}')">@${esc(p.user)}</button>${badgeHTML(p.user)}</b><div class="muted">Xgram</div></div></div>${mediaHTML}<div class="pad"><div class="actions"><button class="like ${p.likes.includes(current)?'liked':''}" onclick="like(${p.id})">${p.likes.includes(current)?'<svg class="icon heart" viewBox="0 0 24 24"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8l1.1 1.1L12 21l7.8-7.5 1.1-1.1a5.5 5.5 0 0 0-.1-7.8z"/></svg>':'<svg class="icon heart" viewBox="0 0 24 24"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8l1.1 1.1L12 21l7.8-7.5 1.1-1.1a5.5 5.5 0 0 0-.1-7.8z"/></svg>'} ${p.likes.length}</button><button class="secondary" onclick="comment(${p.id})">Komentar · ${p.comments.length}</button></div><p><b>@${esc(p.user)}${badgeHTML(p.user)}</b> ${esc(p.caption)}</p>${p.comments.map(c=>`<p class="muted"><b>@${esc(c.user)}</b> ${esc(c.text)}</p>`).join('')}</div></article>`
  }).join('')||'<div class="panel empty">Belum ada postingan.<br>Bagikan foto/video pertamamu.</div>'
}

function showProfile(){$('chats').classList.add('hidden');viewProfile(current)}
function viewProfile(name){
 $('chats').classList.add('hidden');$('uploadPage').classList.add('hidden');let u=users[name];if(!u)return;
 u.followers=u.followers||[];u.following=u.following||[];
 let mine=posts.filter(p=>p.user===name),isMe=name===current,isFollowing=(users[current].following||[]).includes(name);
 $('stories').classList.add('hidden');$('profile').classList.remove('hidden');$('feed').innerHTML='';
 
 let gridHTML = mine.map(p => {
    return (p.type && p.type.startsWith('video')) 
      ? `<video src="${p.img}" muted></video>` 
      : `<img src="${p.img}" alt="Post">`;
 }).join('');

 $('profile').innerHTML=`<div class="profilecover" style="background-image:${u.wallpaper?`url('${u.wallpaper}')`:'none'}"></div><div class="profilehead"><img class="profilepic" src="${u.avatar||''}" onerror="this.style.display='none'" alt="Foto profil"><div><h2 style="margin:0">${esc(name)}${badgeHTML(name)}</h2>${users[name].role?`<div>${badgeHTML(name,true)}</div>`:''}<div class="statrow"><span><b>${mine.length}</b><small>postingan</small></span><span><b>${u.followers.length}</b><small>followers</small></span><span><b>${u.following.length}</b><small>following</small></span></div>${!isMe?`<button class="${isFollowing?'secondary':''}" onclick="toggleFollow('${esc(name)}')">${isFollowing?'Mengikuti':'Follow'}</button>`:''}</div></div><div class="pad"><p>${esc(u.bio||'')}</p>${isMe?`<div class="profiletools"><label class="muted">Foto profil <input id="avatarFile" type="file" accept="image/*" onchange="setAvatar()"></label><label class="muted">Wallpaper profil <input id="wallpaperFile" type="file" accept="image/*" onchange="setWallpaper()"></label><button class="secondary" onclick="removeWallpaper()">Hapus wallpaper</button></div><input id="bioedit" placeholder="Tulis bio profil..." value="${esc(u.bio||'')}"><button onclick="saveBio()">Simpan bio</button><button onclick="logout()" style="background:#e11d48; margin-top: 10px; width: 100%;">Keluar Akun</button>`:''}</div><div class="grid">${gridHTML}</div>`;
}

function toggleFollow(name){
 if(!users[name]||name===current)return;
 users[current].following=users[current].following||[];users[name].followers=users[name].followers||[];
 if(users[current].following.includes(name)){users[current].following=users[current].following.filter(x=>x!==name);users[name].followers=users[name].followers.filter(x=>x!==current)}
 else {users[current].following.push(name);if(!users[name].followers.includes(current))users[name].followers.push(current)}
 saveLocal();viewProfile(name);
}
function saveBio(){users[current].bio=$('bioedit').value;saveLocal();showProfile()}
function setAvatar(){let f=$('avatarFile').files[0];readMedia(f,data=>{users[current].avatar=data;saveLocal();showProfile()})}
function setWallpaper(){let f=$('wallpaperFile').files[0];readMedia(f,data=>{users[current].wallpaper=data;saveLocal();showProfile()})}
function removeWallpaper(){users[current].wallpaper='';saveLocal();showProfile()}

function renderStories(){
  stories=stories.filter(x=>Date.now()-x.created<86400000);
  let active=[...new Map(stories.map(x=>[x.user,x])).values()];
  $('storyrow').innerHTML=`<div class="story" onclick="addStory()"><div class="storyring"><div class="avatar"><svg class="icon small" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></div></div>Tambah story</div>`+active.slice(0,12).map(st=>{
    let inner = (st.type && st.type.startsWith('video')) 
      ? `<video class="avatar storyphoto" src="${st.img}" muted></video>` 
      : `<img class="avatar storyphoto" src="${st.img}" alt="Story">`;
    return `<div class="story" onclick="viewStory(${st.id})"><div class="storyring">${inner}</div><div class="muted" style="margin-top:5px">${esc(st.user)}${badgeHTML(st.user)}</div></div>`
  }).join('')
}

function chatKey(a,b){return [a,b].sort().join('::')}
function showChats(){ $('profile').classList.add('hidden');$('stories').classList.add('hidden');$('uploadPage').classList.add('hidden');$('feed').innerHTML='';$('chats').classList.remove('hidden');let names=Object.keys(users).filter(x=>x!==current);$('chats').innerHTML=`<div class="pad"><h3>Pesan</h3><p class="muted">Pilih pengguna untuk mulai chat.</p></div><div class="chatlist">${names.map(n=>`<div class="chatitem" onclick="openChat('${esc(n)}')">${avatarHTML(n)}<b>@${esc(n)}${badgeHTML(n)}</b></div>`).join('')||'<div class="empty">Belum ada pengguna lain. Buat akun lain di browser ini untuk mencoba chat.</div>'}</div>`}
function openChat(name){if(!users[name])return;let key=chatKey(current,name);chats[key]=chats[key]||[];$('chats').innerHTML=`<div class="pad row"><button class="secondary" onclick="showChats()">←</button>${avatarHTML(name)}<b>@${esc(name)}${badgeHTML(name)}</b><button class="secondary" onclick="viewProfile('${esc(name)}')">Profil</button></div><div id="chatmsgs" class="chatmsgs">${chats[key].map(m=>`<div class="bubble ${m.from===current?'mine':''}"><b>@${esc(m.from)}</b><br>${esc(m.text)}</div>`).join('')}</div><form class="chatcompose" onsubmit="sendMessage(event,'${esc(name)}')"><input id="chatinput" placeholder="Tulis pesan..." autocomplete="off"><button>Kirim</button></form>`;let box=$('chatmsgs');box.scrollTop=box.scrollHeight}
function sendMessage(e,name){e.preventDefault();let input=$('chatinput'),txt=input.value.trim();if(!txt)return;let key=chatKey(current,name);chats[key]=chats[key]||[];chats[key].push({from:current,text:txt,created:Date.now()});saveLocal();openChat(name)}
function badgeHTML(u,roleOnly=false){let a=users[u]||{};return (a.verified&&!roleOnly?' <span class=\"verified\" title=\"Terverifikasi\">✓</span>':'')+(a.role?' <span class=\"role-badge\">'+esc(a.role)+'</span>':'')}
function avatarHTML(u){return users[u]?.avatar?`<img class="avatar" src="${users[u].avatar}" alt="">`:`<div class="avatar">${esc(u[0]?.toUpperCase()||"X")}</div>`}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

function toggleTheme(){document.body.classList.toggle('dark');localStorage.setItem('xgramTheme',document.body.classList.contains('dark')?'dark':'light');updateThemeButton()}
function updateThemeButton(){let b=$('themeBtn');if(b)b.innerHTML=document.body.classList.contains('dark')?'<svg class="icon small" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32 1.41 1.41M2 12h2m16 0h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>':'<svg class="icon small" viewBox="0 0 24 24"><path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5 8.5 8.5 0 1 0 20.5 14.5z"/></svg>'}
</script></body></html>
